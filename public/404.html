<html>

    <meta charset="utf-8">
    <title>Protocolo Solar | Descubra onde passar seu próximo aniversário</title>
    <meta property="og:site_name" content="Protocolo Solar" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Protocolo Solar | Onde passar seu próximo aniversário" />
    <meta property="og:description" content="Descubra a cidade do mundo que ativa o ano que você quer viver — mais dinheiro, amor ou carreira pela Revolução Solar." />
    <meta property="og:image" content="https://protocolosolar.com.br/earth-orbital-hires.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>

  </body>
</html>
